name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-test-and-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sqm-playground-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sqm-playground-web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text
      - run: npm run build
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: sqm-playground-web/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test publication routing
        run: |
          python3 -m venv "$RUNNER_TEMP/publication-tests"
          "$RUNNER_TEMP/publication-tests/bin/python" -m pip install coverage==7.13.0
          mkdir -p target
          "$RUNNER_TEMP/publication-tests/bin/python" -m coverage run --branch --source=.github/scripts --omit='*/test_*.py' --data-file=target/publication.coverage -m unittest discover -s .github/scripts -p test_maven_publish_version.py
          "$RUNNER_TEMP/publication-tests/bin/python" -m coverage xml --data-file=target/publication.coverage -o target/publication-coverage.xml
          "$RUNNER_TEMP/publication-tests/bin/python" -m coverage report --data-file=target/publication.coverage --fail-under=80

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'

      - name: Build & Test
        run: mvn -B verify

      # Upload all per-module HTML for download
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: '**/target/site/jacoco/jacoco.xml,target/publication-coverage.xml'
          flags: unittests
          fail_ci_if_error: true
